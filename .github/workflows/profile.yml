name: perfil

on:
  push:
    branches: [main]
    paths: [profile.json, scripts/build.py]
  schedule:
    - cron: "7 14 * * 1" # lunes 8:07 a. m. CDMX
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar SVGs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          pip install fonttools brotli
          python scripts/build.py

      - name: Changelog semanal
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/changelog.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || git commit -m "perfil: actualización automática"
          git push
